[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "active-coronagraph"
version = "0.1.0"
description = "Coronagraph simulation utilities for active focal-plane mask studies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Liurong Lin" },
]
keywords = [
  "astronomy",
  "coronagraph",
  "scientific-computing",
  "optics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy",
  "hcipy",
  "matplotlib",
  "numpy",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
active-coronagraph = "active_coronagraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/active_coronagraph"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/data/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
